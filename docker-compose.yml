services:
  saul-api:
    image: ${SAUL_IMAGE:?Set SAUL_IMAGE to a released container digest}
    container_name: saul_backend
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: '3000'
    volumes:
      - saul-data:/app/data

  caddy:
    image: caddy:2
    container_name: saul_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from ${DOMAIN:?Set DOMAIN to your public hostname} --to http://saul-api:3000
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      saul-api:
        condition: service_healthy

volumes:
  saul-data:
  caddy_data:
  caddy_config:
