name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          
      - name: Install Dependencies
        run: |
          npm ci
          cd web && npm ci
          
      - name: Run Linter
        run: npm run lint
        
      - name: Typecheck Backend
        run: npx tsc --noEmit
        
      - name: Build Web Frontend
        run: cd web && npm run build

  build-docker:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-android:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
          
      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: saul-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  deploy:
    needs: build-docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Authenticate Docker with GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # 2. Write Environment Variables securely to an .env file
            cat <<EOF > /home/${{ secrets.EC2_USERNAME }}/saul/.env
            NODE_ENV=production
            PORT=3000
            BETTER_AUTH_URL=http://${{ secrets.EC2_HOST }}:3000
            BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            TURSO_DATABASE_URL=file:/app/data/local-turso.db
            TURSO_SYNC_URL=${{ secrets.TURSO_SYNC_URL }}
            TURSO_AUTH_TOKEN=${{ secrets.TURSO_AUTH_TOKEN }}
            EOF
            
            # 3. Pull the latest image and restart the container
            cd /home/${{ secrets.EC2_USERNAME }}/saul
            docker-compose pull
            docker-compose up -d --remove-orphans
